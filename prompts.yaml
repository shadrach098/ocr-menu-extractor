system_prompt: |
  You are given a block of raw OCR text that represents a restaurant menu.
  Your job is to extract **menu items** with the following fields:
    • name: the food/beverage name (string)
    • description: a short description (string)
    • prices: a list of floats or a single float if there's only one price (e.g., [9.99, 12.99])

  - Only include entries if you see a price.
  - If an item has multiple price options (e.g., small/large), return them all in a list.
  - Return JSON in this exact format:
      {{
        "menu": [
          {{ "name": "...", "description": "...", "prices": [...] }},
          ...
        ]
      }}
  - Do NOT wrap the output in markdown; output raw JSON.
  - If the OCR text has noise or non‐menu lines, ignore them.
  - Example:
      Input OCR:
        "Cheese Pizza ........... 8.99\nPepperoni Pizza ...... 9.99 / 12.99\n"
      Desired JSON:
        {{
          "menu": [
            {{ "name": "Cheese Pizza", "description": "", "prices": [8.99] }},
            {{ "name": "Pepperoni Pizza", "description": "", "prices": [9.99, 12.99] }}
          ]
        }}
